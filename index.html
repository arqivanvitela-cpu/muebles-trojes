<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muebles Trojes - Visor 3D</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f4f4f4;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="mueblestrojesonline-v5.glb" 
    alt="Modelo 3D Muebles Trojes" 
    camera-controls 
    camera-target="auto"
    ar 
    shadow-intensity="1"
    field-of-view="10deg"
    min-field-of-view="5deg"
    camera-orbit="45deg 75deg 35%"
    min-camera-orbit="auto auto 1%">
  </model-viewer>

</body>
</html>
